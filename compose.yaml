services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=nadipayment-db'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nadi}'
      - 'POSTGRES_USER=nadi'
    ports:
      - '5432'

  kafka:
    image: 'apache/kafka:latest'
    container_name: 'nadi-kafka'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - '9092:9092'

  kafka-ui:
    image: 'provectuslabs/kafka-ui:latest'
    container_name: 'nadi-kafka-ui'
    ports:
      - '8088:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: 'nadi-payment-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka

  loki:
    image: 'grafana/loki:latest'
    container_name: 'nadi-loki'
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: 'grafana/grafana:latest'
    container_name: 'nadi-grafana'
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - loki
