server:
  port: 8086

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nadipayment-db}
    username: ${SPRING_DATASOURCE_USERNAME:nadi}
    password: ${SPRING_DATASOURCE_PASSWORD:nadi}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:payment-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.payment.nadi.*,java.util,java.lang"
    admin:
      fail-on-create-error: false
      auto-create: true

kafka:
  topics:
    payment-completed: ${KAFKA_TOPIC_PAYMENT_COMPLETED:payment.completed}
    payment-failed: ${KAFKA_TOPIC_PAYMENT_FAILED:payment.failed}
    payment-initiated: ${KAFKA_TOPIC_PAYMENT_INITIATED:payment.initiated}
    transfer-completed: ${KAFKA_TOPIC_TRANSFER_COMPLETED:payment.transfer-completed}
    all-events: ${KAFKA_TOPIC_ALL_EVENTS:payment.events}
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
  consumer:
    enabled: ${KAFKA_CONSUMER_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

payment:
  default-currency: ETB
  idempotency:
    ttl-minutes: 1440
  providers:
    telebirr:
      enabled: true
      base-url: ${TELEBIRR_BASE_URL:https://app.ethiomobilemoney.et:2121}
      app-id: ${TELEBIRR_APP_ID:}
      app-key: ${TELEBIRR_APP_KEY:}
      short-code: ${TELEBIRR_SHORT_CODE:}
      public-key: ${TELEBIRR_PUBLIC_KEY:}
      private-key: ${TELEBIRR_PRIVATE_KEY:}
      callback-url: ${TELEBIRR_CALLBACK_URL:http://localhost:8080/api/v1/payment-providers/telebirr/callback}
      return-url: ${TELEBIRR_RETURN_URL:http://localhost:8080/api/v1/payments/return}
      timeout-seconds: 15

logging:
  level:
    root: INFO
    com.payment.nadi: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.apache.kafka: INFO

loki:
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
  enabled: ${LOKI_ENABLED:true}

